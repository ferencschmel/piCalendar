# Optional. Only needed if you want the dashboard on port 80, TLS, or basic
# auth in front of the admin page. Without it the Node process serves
# everything directly on PORT.
#
# Install to /etc/nginx/sites-available/picalendar and symlink into sites-enabled.

server {
    listen 80;
    server_name picalendar.local;

    # Long-lived polling connections from the wall display; keep timeouts
    # generous so a slow feed sync never breaks the dashboard's request.
    proxy_read_timeout 75s;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uncomment to require a password for the admin UI in addition to
    # ADMIN_TOKEN. The API guard is what actually protects mutations.
    # location /admin {
    #     auth_basic "piCalendar admin";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://127.0.0.1:4000;
    # }
}
